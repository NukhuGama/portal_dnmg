{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% translate "Password Reset Complete" %} | Portal DNMG</title>
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/font/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fonts/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #0d3b66 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="card glass-card border-0 text-white p-4 shadow-lg">
                    <div class="card-body p-2">
                        <i class="bi bi-shield-check text-success fs-1 d-block mb-3"></i>
                        <h4 class="card-title mb-3">{% translate "Password Changed" %}</h4>
                        <p class="small text-white-50 mb-4">
                            {% translate "Your password has been successfully reset. You may now log in to the administrative system with your new password." %}
                        </p>
                        
                        <a href="{% url 'users:login' %}" class="btn btn-warning w-100 py-2.5 fw-bold text-dark rounded-pill transition">
                            {% translate "Log In Now" %}
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

server {
    listen 80;
    server_name dnmg.gov.tl www.dnmg.gov.tl;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dnmg.gov.tl www.dnmg.gov.tl;

    ssl_certificate /etc/letsencrypt/live/dnmg.gov.tl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dnmg.gov.tl/privkey.pem;

    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Confidential HR records are deliberately not web-server media. Django
    # serves them through authenticated download endpoints instead.
    location ^~ /media/hr/documents/ { return 404; }
    location ^~ /media/hr/downloads/ { return 404; }

    # Update this path to the absolute media directory on the server.
    location /media/ {
        alias /srv/dnmg_portal_data/media/;
        try_files $uri @media_unavailable;
    }

    # Keep missing uploads user-friendly instead of exposing an Nginx or
    # storage-path error. The browser remains on the requested media URL.
    location @media_unavailable {
        rewrite ^ /media-unavailable/ break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

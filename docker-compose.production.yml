services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "false"
      REDIS_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MEDIA_HOST_PATH:-./media}:/app/media
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  sync:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/bin/sh", "/app/scripts/sync-loop.sh"]
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "false"
      REDIS_URL: redis://redis:6379/1
      SYNC_INTERVAL_SECONDS: "300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MEDIA_HOST_PATH:-./media}:/app/media
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, time; from pathlib import Path; p = Path('/tmp/dnmg-last-successful-sync'); sys.exit(0 if p.exists() and time.time() - p.stat().st_mtime <= 900 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3

  awos-sync:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/bin/sh", "/app/scripts/awos-sync-loop.sh"]
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MEDIA_HOST_PATH:-./media}:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; from pathlib import Path; p = Path('/tmp/dnmg-last-successful-awos-sync'); max_age = max(int(os.getenv('AWOS_SYNC_INTERVAL_SECONDS', '300')) * 2, 180); sys.exit(0 if p.exists() and time.time() - p.stat().st_mtime <= max_age else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 3m
      retries: 3

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
